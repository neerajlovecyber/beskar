[workspace]
members = [
    "crates/beskar-core",
    "crates/beskar-compositor",
    "crates/beskar-services",
    "crates/beskar-theme",
    "crates/beskar-ui",
    "crates/beskar-shell",
]
default-members = ["crates/beskar-shell"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
futures-util = "0.3"
zbus = "5.18"
chrono = "0.4"
niri-ipc = "26.4"
gpui = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["wayland"] }
gpui-kit = "0.7.1"

# Workspace crates
beskar-core = { path = "crates/beskar-core" }
beskar-compositor = { path = "crates/beskar-compositor" }
beskar-services = { path = "crates/beskar-services" }
beskar-theme = { path = "crates/beskar-theme" }
beskar-ui = { path = "crates/beskar-ui" }
