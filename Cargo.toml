[workspace]
members = [
    "crates/beskar-core",
    "crates/beskar-compositor",
    "crates/beskar-services",
    "crates/beskar-theme",
    "crates/beskar-ui",
    "crates/beskar-shell",
]
default-members = ["crates/beskar-shell"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
futures-util = "0.3"
zbus = "5.18"
chrono = "0.4"
niri-ipc = "26.4"
gpui-kit = "0.7.1"
pulseaudio = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = { version = "0.33", default-features = false, features = ["component", "disk", "system"] }
notify = "8.0"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
hyprland = "0.4.0-beta.3"

# Workspace crates
beskar-core = { path = "crates/beskar-core" }
beskar-compositor = { path = "crates/beskar-compositor" }
beskar-services = { path = "crates/beskar-services" }
beskar-theme = { path = "crates/beskar-theme" }
beskar-ui = { path = "crates/beskar-ui" }
